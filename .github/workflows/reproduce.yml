name: Reproduce

# Runs reproduce.sh on Linux, Windows and macOS. A failed job means the bug is reproduced:
# the executable jar misses androidx.compose.runtime.Composer while `kotlin run` finds it.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  reproduce:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # java and jar for reproduce.sh; the code targets Java 25.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - name: reproduce.sh (fails when the bug is reproduced)
        run: ./reproduce.sh
